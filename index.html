<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>Gemini AI Chatbot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    :root {
        --bg: #0b1220;
        --bg-2: #101a2e;
        --panel: #151f36;
        --border: rgba(255, 255, 255, .07);
        --text: #e8eefc;
        --muted: #8fa0bf;
        --accent: #4f8cff;
        --accent-2: #7c5cff;
        --grad: linear-gradient(135deg, #4f8cff, #7c5cff);
        --user-bubble: linear-gradient(135deg, #4285f4, #7c3aed);
        --bot-bubble: #223052;
        --ok: #2fd57e;
        --err: #ff5c7a;
        --warn: #ffb84d;
        --radius: 16px;
        --shadow: 0 12px 32px rgba(0, 0, 0, .35);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }

    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; padding: 24px 12px; }

    .app { width: 100%; max-width: 760px; height: calc(100vh - 48px); min-height: 540px; display: flex; flex-direction: column; background: var(--bg-2); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }

    header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--panel); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand .mark { width: 40px; height: 40px; border-radius: 12px; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 18px; flex-shrink: 0; }
    .brand h1 { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand p { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand p a { color: var(--accent); text-decoration: none; }
    .brand p a:hover { text-decoration: underline; }

    .keybar { padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--bg-2); }
    .keybar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .key-row { display: flex; gap: 10px; }
    .key-row input {
        flex: 1; background: #0d1526; border: 1px solid var(--border); border-radius: 12px;
        padding: 12px 14px; color: var(--text); font-size: 13px;
    }
    .key-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79, 140, 255, .15); }
    .saved-state { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .saved-state .note { font-size: 12.5px; color: var(--ok); display: flex; align-items: center; gap: 8px; }
    .saved-state .note.warn { color: var(--warn); }
    .key-actions { display: flex; gap: 8px; }

    .btn {
        padding: 12px 16px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700;
        font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: filter .2s, transform .2s, border-color .2s, color .2s, background .2s; flex-shrink: 0;
    }
    .btn.primary { background: var(--grad); color: #fff; }
    .btn.primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--text); }
    .btn.small { padding: 8px 12px; font-size: 12px; }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none !important; }

    .chat-head { padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .chat-head h2 { font-size: 13px; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .chat-head h2 .status-badge { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(47, 213, 126, .8); display: inline-block; }
    .chat-head .model-tag { font-size: 11px; color: var(--muted); background: #0d1526; border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }

    .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; background: radial-gradient(900px 500px at 80% -10%, rgba(124, 58, 237, .07), transparent 60%); }

    .msg { display: flex; gap: 10px; max-width: 85%; animation: pop .25s ease; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .msg.error { align-self: flex-start; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--grad); display: grid; place-items: center; color: #fff; font-size: 14px; flex-shrink: 0; }
    .msg.user .avatar { background: linear-gradient(135deg, #8e2de2, #4a00e0); }
    .msg.error .avatar { background: rgba(255, 92, 122, .9); }

    .bubble { padding: 11px 14px; border-radius: 16px; background: var(--bot-bubble); min-width: 0; }
    .msg.bot .bubble { border-bottom-left-radius: 4px; }
    .msg.user .bubble { background: var(--user-bubble); color: #fff; border-bottom-right-radius: 4px; }
    .msg.error .bubble { background: rgba(255, 92, 122, .12); border: 1px solid rgba(255, 92, 122, .3); color: #ffc7d0; border-bottom-left-radius: 4px; }
    .bubble p { font-size: 13.5px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
    .bubble .meta { display: block; margin-top: 5px; font-size: 10.5px; opacity: .55; }

    .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 0; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: #cbd8ff; animation: blink 1.3s infinite both; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; transform: scale(.8); } 40% { opacity: 1; transform: scale(1); } }

    @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }

    .composer { padding: 12px 20px 10px; border-top: 1px solid var(--border); background: var(--panel); }
    .composer .row { display: flex; gap: 10px; }
    .composer input {
        flex: 1; background: #0d1526; border: 1px solid var(--border); border-radius: 24px;
        padding: 13px 18px; color: var(--text); font-size: 13.5px; transition: border-color .2s;
    }
    .composer input:focus { outline: none; border-color: var(--accent); }
    .composer .btn { width: 48px; height: 48px; min-width: 48px; border-radius: 50%; padding: 0; }
    .form-error { color: var(--err); font-size: 12px; margin-top: 8px; min-height: 15px; }
    .hint-line { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; margin-top: 6px; gap: 10px; flex-wrap: wrap; }
    .hint-line a { color: var(--accent); text-decoration: none; }
    .hint-line a:hover { text-decoration: underline; }

    .msgs::-webkit-scrollbar { width: 8px; }
    .msgs::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, .10); border-radius: 10px; }

    @media (max-width: 640px) {
        body { padding: 0; }
        .app { height: 100vh; border-radius: 0; border: none; border-left: none; border-right: none; }
        .msg { max-width: 90%; }
        .chat-head { padding: 10px 14px; }
        .msgs { padding: 14px; }
        .composer { padding: 10px 12px 8px; }
        .keybar { padding: 10px 14px; }
    }
</style>
</head>
<body>
    <div class="app">
        <header>
            <div class="brand">
                <div class="mark"><i class="fas fa-brain"></i></div>
                <div>
                    <h1>Gemini AI Chatbot</h1>
                    <p>Google Gemini 1.5 Flash · by <a href="https://github.com/thesajidalam">@thesajidalam</a></p>
                </div>
            </div>
        </header>

        <section class="keybar">
            <h2><i class="fas fa-key"></i> Gemini API key</h2>
            <div id="keyArea"></div>
        </section>

        <div class="chat-head">
            <h2><span class="status-badge" id="apiStatus"></span><span id="apiStatusText">Chat</span></h2>
            <div style="display:flex;align-items:center;gap:8px;">
                <button class="btn ghost small" id="newChatBtn"><i class="fas fa-plus"></i> New chat</button>
                <span class="model-tag"><i class="fas fa-bolt"></i> gemini-1.5-flash</span>
            </div>
        </div>

        <div class="msgs" id="messages"></div>

        <div class="composer">
            <div class="row">
                <input type="text" id="msgInput" placeholder="Ask Gemini anything…" autocomplete="off" disabled>
                <button class="btn primary" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="form-error" id="formError"></div>
            <div class="hint-line">
                <span>Press <strong>Enter ↵</strong> to send</span>
                <span>Get a free key at <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio ↗</a></span>
            </div>
        </div>
    </div>

<script>
    const $ = id => document.getElementById(id);
    const keyArea = $('keyArea');
    const msgInput = $('msgInput');
    const sendBtn = $('sendBtn');
    const messages = $('messages');
    const formError = $('formError');
    const apiStatus = $('apiStatus');
    const apiStatusText = $('apiStatusText');

    const MODEL = 'gemini-1.5-flash';
    const LS_KEY = 'gemini_api_key';
    let history = [];
    let busy = false;

    function getKey() { try { return localStorage.getItem(LS_KEY) || ''; } catch (e) { return ''; } }
    function setKey(k) { try { k ? localStorage.setItem(LS_KEY, k) : localStorage.removeItem(LS_KEY); } catch (e) {} }

    function renderKeyState() {
        const has = getKey().trim().length > 0;
        keyArea.innerHTML = '';
        const row = document.createElement('div');

        if (has) {
            row.className = 'saved-state';
            const note = document.createElement('div');
            note.className = 'note';
            note.innerHTML = '<i class="fas fa-check-circle"></i> API key saved — stored only in this browser';
            const actions = document.createElement('div');
            actions.className = 'key-actions';

            const replace = document.createElement('button');
            replace.className = 'btn ghost small';
            replace.innerHTML = '<i class="fas fa-sync-alt"></i> Replace key';
            replace.onclick = () => setKeyState(false);

            const remove = document.createElement('button');
            remove.className = 'btn ghost small';
            remove.style.borderColor = 'rgba(255,92,122,.35)';
            remove.style.color = 'var(--err)';
            remove.innerHTML = '<i class="fas fa-eraser"></i> Remove key';
            remove.onclick = () => {
                setKey('');
                addSystem('API key removed from this browser.');
                renderKeyState();
                setApiReady(false);
            };

            actions.appendChild(replace);
            actions.appendChild(remove);
            row.appendChild(note);
            row.appendChild(actions);
        } else {
            row.className = 'key-row';
            const input = document.createElement('input');
            input.type = 'password';
            input.placeholder = 'Paste your Gemini API key here (AIza…)';
            input.autocomplete = 'off';
            input.id = 'tmpKeyInput';
            const save = document.createElement('button');
            save.className = 'btn primary';
            save.innerHTML = '<i class="fas fa-lock"></i> Save & start';
            save.onclick = () => {
                const v = input.value.trim();
                if (!v) {
                    formError.textContent = 'Paste your Gemini API key to continue.';
                    input.focus();
                    return;
                }
                setKey(v);
                formError.textContent = '';
                renderKeyState();
                setApiReady(true);
                addSystem('API key saved in this browser. You can chat with Gemini now.');
            };
            row.appendChild(input);
            row.appendChild(save);
            input.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); });
        }
        keyArea.appendChild(row);
        setApiReady(has);
    }

    function setApiReady(ready) {
        apiStatus.style.background = ready ? 'var(--ok)' : 'rgba(255,184,77,.9)';
        apiStatus.style.boxShadow = ready ? '0 0 8px rgba(47,213,126,.8)' : '0 0 8px rgba(255,184,77,.7)';
        apiStatusText.textContent = ready ? 'Ready to chat' : 'No API key set';
        msgInput.disabled = !ready;
        sendBtn.disabled = !ready;
    }

    function setBusy(v) {
        busy = v;
        sendBtn.disabled = v || msgInput.disabled;
        sendBtn.innerHTML = v ? '<i class="fas fa-circle-notch fa-spin"></i>' : '<i class="fas fa-paper-plane"></i>';
    }

    function now() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function scrollDown() { messages.scrollTop = messages.scrollHeight; }

    function addMessage(text, who, meta) {
        const row = document.createElement('div');
        row.className = 'msg ' + who;
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = who === 'user' ? '<i class="fas fa-user"></i>' : who === 'error' ? '<i class="fas fa-triangle-exclamation"></i>' : '<i class="fas fa-robot"></i>';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const p = document.createElement('p');
        p.textContent = text;
        bubble.appendChild(p);
        if (meta) {
            const m = document.createElement('span');
            m.className = 'meta';
            m.textContent = meta;
            bubble.appendChild(m);
        }
        row.appendChild(avatar);
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollDown();
        return row;
    }

    function addSystem(text) {
        const row = document.createElement('div');
        row.className = 'msg error';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const p = document.createElement('p');
        p.textContent = text;
        bubble.appendChild(p);
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollDown();
    }

    function showTyping() {
        const row = document.createElement('div');
        row.className = 'msg bot typing-row';
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.innerHTML = '<i class="fas fa-robot"></i>';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const t = document.createElement('div');
        t.className = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        bubble.appendChild(t);
        row.appendChild(avatar);
        row.appendChild(bubble);
        messages.appendChild(row);
        scrollDown();
        return row;
    }

    async function askGemini(userText) {
        const key = getKey().trim();
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + MODEL + ':generateContent?key=' + encodeURIComponent(key);

        const contents = history.map(m => ({ role: m.role, parts: [{ text: m.text }] }));
        const body = {
            contents: contents,
            generationConfig: { temperature: 0.7, topK: 40, topP: 0.95, maxOutputTokens: 1024 }
        };

        let res;
        try {
            res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
        } catch (e) {
            throw new Error('Network error — check your connection.');
        }

        const data = await res.json().catch(() => null);
        if (!data) throw new Error('Unexpected response from the Gemini API.');

        if (data.error) {
            const code = (data.error.code || '').toString();
            let msg = data.error.message || 'Gemini API error.';
            if (code === '400' && /key/i.test(msg)) msg = 'Invalid API key. Check it and try again.';
            if (code === '404') msg = 'Model not available (or API key restricted).';
            if (code === '403') msg = 'Access denied — the key may be restricted or expired.';
            throw new Error(msg);
        }

        const text = (data.candidates && data.candidates[0] && data.candidates[0].content &&
            data.candidates[0].content.parts || []).map(p => p.text || '').join('');
        if (!text.trim()) throw new Error('Gemini returned an empty response. Try again.');
        return text;
    }

    async function handleSend() {
        if (busy) return;
        const text = msgInput.value.trim();
        if (!text) { formError.textContent = 'Type a message first.'; return; }
        if (!getKey().trim()) { formError.textContent = 'Add your Gemini API key above to chat.'; return; }
        formError.textContent = '';

        msgInput.value = '';
        history.push({ role: 'user', text: text });
        addMessage(text, 'user', now());
        const typingRow = showTyping();
        setBusy(true);

        try {
            const reply = await askGemini(text);
            history.push({ role: 'model', text: reply });
            typingRow.remove();
            addMessage(reply, 'bot', now());
        } catch (e) {
            history = history.filter(m => m.role !== 'user' || m.text !== text);
            typingRow.remove();
            addMessage(e.message, 'error', now());
        } finally {
            setBusy(false);
            msgInput.focus();
        }
    }

    function clearConversation() {
        history = [];
        messages.querySelectorAll('.msg').forEach(el => el.remove());
        addSystem('New conversation started. Go ahead and ask.');
        msgInput.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    $('newChatBtn').addEventListener('click', clearConversation);
    msgInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });

    renderKeyState();
    addSystem('Welcome! Paste your free Gemini API key above (from Google AI Studio) to start chatting. Your key stays in this browser only.');
</script>
</body>
</html>
